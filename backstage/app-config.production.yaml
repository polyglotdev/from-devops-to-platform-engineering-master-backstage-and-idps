app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: http://localhost:7007
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  environment: production
  providers:
    github:
      production:
        clientId: ${GITHUB_AUTH_CLIENT_ID}
        clientSecret: ${GITHUB_AUTH_CLIENT_SECRET}

catalog:
  # Production catalog configuration
  # File locations are relative to the backend process root (typically container root)
  rules:
    - allow: [Component, System, API, Resource, Location, Domain, Group, User, Template]
  locations:
    # Platform Demo Catalog - Organization Structure
    - type: file
      target: ./catalog/groups.yaml
      rules:
        - allow: [User, Group]

    # Platform Demo Catalog - Domain
    - type: file
      target: ./catalog/domain.yaml
      rules:
        - allow: [Domain]

    # Platform Demo Catalog - System
    - type: file
      target: ./catalog/system.yaml
      rules:
        - allow: [System]

    # Platform Demo Catalog - Infrastructure Resources
    - type: file
      target: ./catalog/resources.yaml
      rules:
        - allow: [Resource]

    # Platform Demo Catalog - CI/CD Pipelines
    - type: file
      target: ./catalog/pipelines.yaml
      rules:
        - allow: [Component]

    # Platform Demo Catalog - API Definition
    - type: file
      target: ./catalog/fastapi-api.yaml
      rules:
        - allow: [API]

    # Platform Demo Catalog - FastAPI Service
    - type: file
      target: ./catalog/fastapi-service.yaml
      rules:
        - allow: [Component]

    # Software Templates
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]
