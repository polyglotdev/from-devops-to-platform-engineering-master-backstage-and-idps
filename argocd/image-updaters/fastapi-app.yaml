apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: fastapi-app
  namespace: argocd
spec:
  # Namespace where ArgoCD Applications are located
  namespace: argocd

  # Global update settings
  commonUpdateSettings:
    updateStrategy: semver
    allowTags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+$"
    forceUpdate: true

  # Git write-back configuration
  writeBackConfig:
    method: git
    gitConfig:
      branch: main
      writeBackTarget: "helmvalues:values.yaml"

  # Application references
  applicationRefs:
    - namePattern: "fastapi-app"
      images:
        - alias: app
          imageName: domniniquehallan/python-fastapi-app
          manifestTargets:
            helm:
              name: image.repository
              tag: image.tag
